<!DOCTYPE html>
 <html lang="en">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postit</title>
    <!-- CryptoJS v4.2.0 from Cloudflare -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="postit.css">
    
 </head>
 
 <body>
  <div class="container">
      <h1> PostIt</h1>
      <!-- STEP 1: User Info — Ask ONCE -->
            <div id="infoSection" class="card">
            <h2>Welcome! Tell us about yourself</h2>
            <p class="note">You only need to fill this out once.</p>
            <input type="text" id="fullName" placeholder="Full Name" required>
            <input type="date" id="birthDate" required>
            <select id="yearLevel" required>
            <option value="">Select Year Level
            <option value="1st Year">1st Year
            <option value="2nd Year">2nd Year
            <option value="3rd Year">3rd Year
            <option value="4th Year">4th Year
            <option value="5th Year">5th Year

       </select>
       <select id="gender" required>
         <option value="">Select Gender</option>
         <option value="Male">Male</option>
         <option value="Female">Female</option>
         <option value="Prefer not to say">Prefer not to say</option>
       </select>
       <input type="text" id="username" placeholder="Username" required>
       <input type="password" id="password" placeholder="Password" required>
       <button id="startBtn">Continue to Post</button>
     </div>
     <!-- STEP 2: Posting Area -->
     <div id="postSection" class="card hidden">
       <div class="welcome">
         Hello, <span id="userNameDisplay"></span>! Share your thoughts 
       </div>
       <textarea id="captionInput" placeholder="Write your caption here..."></textarea>
       <button id="postBtn">Post</button>
       <!-- Thread of all posts -->
       <div id="postsThread"></div>
     </div>
     
   </div>
   <!-- External JavaScript -->
   <script src="postit.js"></script>
 </body>
 </html>
